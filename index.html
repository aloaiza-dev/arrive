<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000">
  <title>ARRIVE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Premium Editorial Font for Mantras -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-primary: #E6E7EA;
      --text-secondary: #F3F4F6;
      --transition-speed: 0.8s;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    body {
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- BACKGROUND LAYERS --- */
    #bg-image-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -2;
      background-size: cover; background-position: center; background-repeat: no-repeat;
      transition: opacity 1s ease-in-out;
      opacity: 0;
      filter: brightness(0.6) contrast(1.1);
    }

    #bg-vignette-layer {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(circle at center, transparent 0%, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
    }

    .container {
      width: 100%; height: 100%;
      padding: 40px 32px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      z-index: 1;
    }

    /* --- EDITORIAL TYPOGRAPHY --- */
    .primary {
      font-family: 'Playfair Display', serif; 
      font-weight: 400; 
      font-size: clamp(2.5rem, 7vw, 4rem); 
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 64px; 
      min-height: 2.5em; 
      display: flex; align-items: center; justify-content: center;
      transition: opacity var(--transition-speed) ease;
      opacity: 1;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .primary:hover { opacity: 0.8; }
    .primary.is-hidden { opacity: 0; }

    .divider {
      width: 1px;
      height: 60px;
      background: rgba(255, 255, 255, 0.3); 
      opacity: 0.8;
      margin-bottom: 32px; 
      transition: opacity var(--transition-speed);
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .secondary {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 48px;
    }

    .clock-time {
      font-size: 1.4rem;
      font-weight: 500;
      color: #F3F4F6; 
      letter-spacing: 0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .date-day {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.9rem;
      font-weight: 400;
      color: #F3F4F6;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    /* --- WEATHER STYLES (Larger Icons) --- */
    .weather-container {
      display: flex; flex-direction: column; align-items: center;
      opacity: 0; transform: translateY(10px);
      transition: opacity 1s ease, transform 1s ease;
      margin-bottom: 48px;
    }

    .weather-container.visible { opacity: 0.8; transform: translateY(0); }

    .weather-icon { 
      /* 1. Increased Base Size */
      width: 48px; /* Was 40px */
      height: 48px; /* Was 40px */
      position: relative; 
      margin-bottom: 8px; 
      opacity: 0.9;
    }

    .weather-icon.is-sun {
      /* 2. Bigger Sun */
      width: 32px; /* Was 28px */
      height: 32px; /* Was 28px */
      background: #fff; border-radius: 50%;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
      animation: sunPulse 4s ease-in-out infinite;
    }
    @keyframes sunPulse { 0%,100% {opacity: 0.8;} 50% {opacity: 1;} }

    .weather-icon.is-cloud, .weather-icon.is-fog {
      /* 3. Bigger Clouds */
      width: 44px; /* Was 34px */
      height: 18px; /* Was 14px */
      background: rgba(255,255,255,0.6); border-radius: 10px;
      position: relative; top: 10px; 
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    .weather-icon.is-cloud::after {
      content: ''; position: absolute; 
      width: 20px; /* Was 16px */
      height: 20px; /* Was 16px */
      background: rgba(255,255,255,0.6); 
      border-radius: 50%; 
      top: -10px; /* Adjusted for size */
      left: 8px;   /* Adjusted for size */
    }

    .weather-icon.is-rain {
      /* 4. Bigger Rain */
      width: 44px; 
      height: 18px; 
      background: rgba(255,255,255,0.6); 
      border-radius: 10px;
      position: relative; top: 10px;
    }
    .weather-icon.is-rain::before {
      content: ''; position: absolute; 
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.6); 
      border-radius: 50%; 
      top: -10px; left: 8px;
    }
    .weather-icon.is-rain::after {
      content: ''; position: absolute; 
      width: 3px; height: 5px;
      background: rgba(255,255,255,0.8); 
      top: 14px; left: 15.5px;
      animation: drop 1.5s linear infinite;
    }
    @keyframes drop { 0% {transform: translateY(0); opacity:0;} 50% {opacity:1;} 100% {transform: translateY(6px); opacity:0;} }

    .weather-icon.is-snow {
      /* 5. Bigger Snow */
      width: 44px; 
      height: 18px; 
      background: rgba(255,255,255,0.6); 
      border-radius: 10px;
      position: relative; top: 10px;
    }
    .weather-icon.is-snow::before {
      content: ''; position: absolute; 
      width: 20px; height: 20px;
      background: rgba(255,255,255,0.6); 
      border-radius: 50%; 
      top: -10px; left: 8px;
    }
    .weather-icon.is-snow::after {
      content: ''; position: absolute; 
      width: 5px; height: 5px;
      background: rgba(255,255,255,0.8); 
      border-radius: 50%;
      top: 12px; left: 14.5px; 
      animation: snow 2s linear infinite;
    }
    @keyframes snow { 0% {transform: translateY(0); opacity:0;} 50% {opacity:1;} 100% {transform: translateY(6px); opacity:0;} }

    .weather-temp {
      font-size: 14px; font-weight: 300; letter-spacing: 0.05em;
      color: #F3F4F6; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
    }

    /* --- BREATHING CIRCLE (More Perceptible) --- */
    .breathing {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      position: relative;
      z-index: 2;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
      transition: opacity 2s ease, border-color 2s ease;
      animation: breathe 8s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
    }

    .breathing::before {
      content: "";
      position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 220px; height: 220px; border-radius: 50%; z-index: -1;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      filter: blur(20px);
      animation: auraPulse 8s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%   { 
        transform: scale(0.90); 
        opacity: 0.5;
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.02);
      }
      40%  { 
        transform: scale(1.05); 
        opacity: 1.0;
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      }
      50%  { 
        transform: scale(1.05); 
        opacity: 1.0; 
        border-color: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
      }
      100% { 
        transform: scale(0.90); 
        opacity: 0.5;
        border-color: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.02);
      }
    }

    @keyframes auraPulse {
      0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.2; }
      40%  { transform: translate(-50%, -50%) scale(1.25); opacity: 0.8; }
      50%  { transform: translate(-50%, -50%) scale(1.25); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.2; }
    }

    /* --- FULLSCREEN BUTTON (Car Friendly) --- */
    #fs-toggle {
      position: fixed; bottom: 32px; right: 32px; width: 80px; height: 80px;
      border-radius: 50%; background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer; opacity: 0.4;
      transition: transform 0.1s ease, opacity 0.3s, background 0.3s;
      display: flex; align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(5px);
    }
    #fs-toggle:hover { opacity: 0.9; background: rgba(255, 255, 255, 0.1); }
    #fs-toggle:active { transform: scale(0.95); opacity: 1; background: rgba(255, 255, 255, 0.2); }
    #fs-toggle svg { width: 32px; height: 32px; fill: #E6E7EA; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); pointer-events: none; }

    /* Night mode */
    .night .secondary { opacity: 1; transition: opacity 2s ease; }
    .night .divider { opacity: 0.4; }
    .night .weather-container { opacity: 0.5; } 
    .night .breathing { animation-duration: 18s; opacity: 0.4; }
    .night .breathing::before { opacity: 0.1; }

    @media (prefers-reduced-motion: reduce) {
      #bg-image-layer, #bg-vignette-layer { transition: none; }
      .breathing, .weather-icon, .breathing::before { animation: none; }
      .weather-icon::after { display: none; } 
      .breathing::before { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div id="bg-image-layer"></div>
  <div id="bg-vignette-layer"></div>

  <div class="container">
    <div class="primary" id="primaryText">Arrive calm.</div>
    <div class="divider"></div>
    
    <!-- Secondary Info: Time & Date -->
    <div class="secondary">
      <span id="clockTime" class="clock-time">--:--</span>
      <span id="dateDay" class="date-day">Loading...</span>
    </div>
    
    <!-- Weather Section -->
    <div class="weather-container" id="weatherContainer">
      <div class="weather-icon" id="weatherIcon"></div>
      <div class="weather-temp" id="weatherTemp"></div>
    </div>

    <div class="breathing"></div>
  </div>

  <button id="fs-toggle" aria-label="Toggle Fullscreen">
    <svg id="icon-expand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    <svg id="icon-compress" viewBox="0 0 24 24" style="display: none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
  </button>

  <script>
    /* --- CONFIGURATION --- */
    const primaryPhrases = {
      morning: [
        "Let's day unfold.", "Start without urgency.", "You’re already moving.",
        "Breath in light.", "Welcome to newness.", "Begin here.",
        "The world is waking up with you.", "Find your rhythm.", "No rush. Just breathe.",
        "A clean slate.", "Today unfolds slowly."
      ],
      afternoon: [
        "Stay in flow.", "Nothing to force.", "This is steady time.",
        "Steady as you go.", "You are doing enough.", "Pause for a moment.",
        "The flow is with you.", "One step at a time.", "Be where you are.",
        "Stillness in motion.", "Keep it simple."
      ],
      evening: [
        "Begin to unwind.", "Arriving calm matters.", "Let's drive soften you.",
        "Release the day.", "Let go.", "The sky is turning.",
        "Welcome to quiet.", "Arrive home to yourself.", "Unclench your jaw.",
        "Ease your mind.", "Slow down."
      ],
      night: [
        "Arrive quietly.", "Nothing else right now.", "Just the road.",
        "Rest in darkness.", "The world is sleeping.", "Nothing to solve now.",
        "Just be.", "Deep peace.", "Close your eyes.",
        "Let's silence in.", "Safe. Silent. Still."
      ]
    };

    // --- CINEMATIC BACKGROUND MATRIX ---
    const backgroundThemes = {
      morning: {
        clear: { img: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        cloud: { img: 'https://images.unsplash.com/photo-1615609516838-835e9b562d1a?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        rain:  { img: 'https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        snow:  { img: 'https://images.unsplash.com/photo-1491002052546-bf38f186af56?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        fog:   { img: 'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' }
      },
      afternoon: {
        clear: { img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        cloud: { img: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        rain:  { img: 'https://images.unsplash.com/photo-1501594907352-04cda38ebc29?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        snow:  { img: 'https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        fog:   { img: 'https://images.unsplash.com/photo-1614677427581-51148a932a9e?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' }
      },
      evening: {
        clear: { img: 'https://images.unsplash.com/photo-1507400492013-162706c8c05e?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        cloud: { img: 'https://images.unsplash.com/photo-1473186578172-c141e6798cf4?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        rain:  { img: 'https://images.unsplash.com/photo-1516934024742-b461fba47600?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        snow:  { img: 'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        fog:   { img: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' }
      },
      night: {
        clear: { img: 'https://images.unsplash.com/photo-1533669955142-6a73332af4db?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        cloud: { img: 'https://images.unsplash.com/photo-1534073828943-f801091a7d58?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        rain:  { img: 'https://images.unsplash.com/photo-1504609773096-104ff2c73ba4?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        snow:  { img: 'https://images.unsplash.com/photo-1486870591958-9b9d0d1dda99?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' },
        fog:   { img: 'https://images.unsplash.com/photo-1500042037927-c7d9260c3342?ixlib=rb-4.1.0&auto=format&fit=crop&w=1920&q=80' }
      }
    };

    /* --- WEATHER LOGIC --- */
    let currentWeatherType = 'clear'; 

    function initWeather() {
      if (!navigator.geolocation) return;

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`)
            .then(response => response.json())
            .then(data => {
              const temp = Math.round(data.current_weather.temperature);
              const code = data.current_weather.weathercode;
              
              let iconClass = "is-sun"; 
              if (code > 0 && code <= 3) { iconClass = "is-cloud"; currentWeatherType = 'cloud'; }
              else if (code >= 45 && code <= 48) { iconClass = "is-fog"; currentWeatherType = 'fog'; }
              else if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) { iconClass = "is-rain"; currentWeatherType = 'rain'; }
              else if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) { iconClass = "is-snow"; currentWeatherType = 'snow'; }
              else { currentWeatherType = 'clear'; }
              
              const iconEl = document.getElementById("weatherIcon");
              const tempEl = document.getElementById("weatherTemp");
              const container = document.getElementById("weatherContainer");

              iconEl.className = `weather-icon ${iconClass}`;
              tempEl.textContent = `${temp}°`;
              container.classList.add("visible");

              updateBackground(getPhase(new Date().getHours()));
            })
            .catch(err => { console.log("Weather fetch failed."); });
        },
        (error) => { console.log("Location access denied."); }
      );
    }

    /* --- APP LOGIC --- */
    function getPhase(hour) {
      if (hour >= 5 && hour < 12) return "morning";
      if (hour >= 12 && hour < 17) return "afternoon";
      if (hour >= 17 && hour < 21) return "evening";
      return "night";
    }

    function getTestHour() {
        const params = new URLSearchParams(window.location.search);
        const hour = params.get('hour');
        return hour ? parseInt(hour) : null;
    }

    let currentPhase = "";
    let lastPhraseIndex = -1; 

    // Interactive Phrase Change
    document.getElementById('primaryText').addEventListener('click', () => {
      const hour = getTestHour() || new Date().getHours();
      const phase = getPhase(hour);
      updatePrimaryText(phase);
    });

    function updatePrimaryText(phase) {
      const primaryText = document.getElementById("primaryText");
      const phrases = primaryPhrases[phase];
      let newIndex = Math.floor(Math.random() * phrases.length);
      
      if (phrases.length > 1 && newIndex === lastPhraseIndex) {
        newIndex = (newIndex + 1) % phrases.length;
      }
      
      lastPhraseIndex = newIndex;
      const phrase = phrases[newIndex];

      primaryText.classList.add('is-hidden');
      setTimeout(() => {
        primaryText.textContent = phrase;
        primaryText.classList.remove('is-hidden');
      }, 800);
    }

    function updateBackground(phase) {
      const weatherType = currentWeatherType || 'clear';
      const theme = backgroundThemes[phase][weatherType];
      const bgLayer = document.getElementById('bg-image-layer');
      const newUrl = theme.img;

      if (bgLayer.style.backgroundImage.includes(newUrl)) return;

      const loader = new Image();
      loader.src = newUrl;
      loader.onload = () => {
        bgLayer.style.opacity = '0';
        setTimeout(() => {
          bgLayer.style.backgroundImage = `url('${newUrl}')`;
          bgLayer.style.opacity = '1';
        }, 1000);
      };
    }

    function updateClockAndPhase() {
      const realNow = new Date();
      const testHour = getTestHour();
      let displayDate = realNow;
      let hour = realNow.getHours();

      if (testHour !== null) {
          displayDate = new Date(realNow);
          displayDate.setHours(testHour);
          hour = testHour;
      }

      const phase = getPhase(hour);

      // UPDATE 1: Time
      document.getElementById("clockTime").textContent =
        displayDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // UPDATE 2: Date
      document.getElementById("dateDay").textContent =
        displayDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();

      // Update Background
      updateBackground(phase);

      // Handle Phase Classes
      if (document.body.classList.contains("night") !== (phase === "night")) {
        document.body.classList.toggle("night", phase === "night");
        updatePrimaryText(phase);
      }
    }

    /* --- FULLSCREEN LOGIC --- */
    const fsBtn = document.getElementById('fs-toggle');
    const iconExpand = document.getElementById('icon-expand');
    const iconCompress = document.getElementById('icon-compress');

    function toggleFullScreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(err => {});
      else if (document.exitFullscreen) document.exitFullscreen();
    }

    function updateFsIcon() {
      if (document.fullscreenElement) {
        iconExpand.style.display = 'none'; iconCompress.style.display = 'block';
      } else {
        iconExpand.style.display = 'block'; iconCompress.style.display = 'none';
      }
    }
    fsBtn.addEventListener('click', toggleFullScreen);
    document.addEventListener('fullscreenchange', updateFsIcon);

    /* --- TIMERS --- */
    const initialPhase = getPhase(getTestHour() || new Date().getHours());
    updatePrimaryText(initialPhase);
    updateClockAndPhase();
    setInterval(updateClockAndPhase, 60 * 1000);
    setInterval(() => {
      const hour = getTestHour() || new Date().getHours();
      const phase = getPhase(hour);
      updatePrimaryText(phase);
    }, 15 * 60 * 1000);
    initWeather();
  </script>
</body>
</html>
